<section class="wrap"><h1>Checkout</h1><p style="color:var(--muted)">Test page. Nothing is charged and nothing is stored.</p>
<form onsubmit="event.preventDefault();document.getElementById('done').textContent='Order placed. Thanks.'">
<label for="em">Email</label><input id="em" type="email" autocomplete="off">
<div class="row"><div><label for="fn">First name</label><input id="fn" autocomplete="off"></div><div><label for="ln">Last name</label><input id="ln" autocomplete="off"></div></div>
<label for="ad">Address</label><input id="ad" autocomplete="off">
<div class="row"><div><label for="ci">City</label><input id="ci" autocomplete="off"></div><div><label for="zp">ZIP</label><input id="zp" autocomplete="off"></div></div>
<label for="cc">Card number (use 4242 4242 4242 4242)</label><input id="cc" inputmode="numeric" autocomplete="off" placeholder="4242 4242 4242 4242">
<div class="row"><div><label for="ex">Expiry</label><input id="ex" placeholder="12/28" autocomplete="off"></div><div><label for="cv">CVC</label><input id="cv" placeholder="123" autocomplete="off"></div></div>
<p><button class="btn" type="submit">Place order · $289.00</button></p><p id="done"></p></form></section>
<footer>Ridgeline Outfitters · a fictional shop for a Passive Signals test</footer></body></html>
